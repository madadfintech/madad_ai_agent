<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AEGIS · Self-healing observability</title>
    <script>
      // Apply the persisted (or OS-preferred) theme BEFORE React mounts so
      // there's no flash of white. Mirrors readInitial() in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("aegis.theme");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.classList.add(mode);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
