# Edge reverse proxy mapping the public domains onto the service containers.
#   ai-api.madadfintech.com  -> conversational/workflow + communication + cms +
#                                document + visibility (path-routed, TLS)
# Legacy host names (api.ai.*, cms.ai.*, ops.ai.*) are kept as HTTP-only
# server blocks for backward compatibility with old integrations.
#
# DNS: uses docker's embedded resolver (127.0.0.11) with a 10-second cache so
# nginx picks up new container IPs after a restart WITHOUT a manual reload.
# The classic ``upstream foo { server foo:8001; }`` block resolves only at
# nginx start and caches the IP forever — after any co-deployed container
# restart, that upstream address goes stale and every request returns
# 502. Using ``set $var host:port; proxy_pass http://$var;`` forces nginx
# to hit the resolver for each new address, so restart cycles are safe.
#
# TLS: served on port 443 for ai-api.madadfintech.com. Cert lives in the
# bind-mounted /etc/letsencrypt/ directory (populated by certbot on the
# host). On first boot a self-signed placeholder is present so nginx can
# bind 443; certbot certonly --webroot replaces it with a real
# Let's Encrypt cert once DNS resolves at this host.

worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve the inbound correlation id (the apps generate one if absent).
    proxy_set_header X-Request-ID      $request_id;

    # Shared client size — CSVs, invoice ZIPs etc.
    client_max_body_size 25M;

    # ------------------------------------------------------------------
    # Public HTTPS for ai-api.madadfintech.com (all admin + API paths)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ai-api.madadfintech.com;

        ssl_certificate     /etc/letsencrypt/live/ai-api.madadfintech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai-api.madadfintech.com/privkey.pem;

        # Mozilla intermediate profile.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — opt in once verified end-to-end.
        # add_header Strict-Transport-Security "max-age=63072000" always;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /cms/ {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location /visibility/ {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
        location = /health { return 200 "ok\n"; }
    }

    # ------------------------------------------------------------------
    # HTTP on port 80 — ACME challenge + redirect to HTTPS.
    # Keep the "= /health" and the /workflow/inbound path also HTTP-usable
    # so MCP S2S callbacks work over the internal + external hop before
    # we switch Ishan's MCP_AGENT_INBOUND_URL to HTTPS.
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ai-api.madadfintech.com;

        # Let's Encrypt HTTP-01 challenge webroot.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Cheap health probe — stays on HTTP so external monitors that
        # don't bother validating TLS keep working.
        location = /health { return 200 "ok\n"; }

        # S2S callback path for MCP → agent stays on HTTP for backward
        # compat until Ishan flips MCP_AGENT_INBOUND_URL to https.
        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }

        # Everything else → HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Legacy host names (backward compat — HTTP only, no user-facing docs)
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name api.ai.madadfintech.com;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location = /health {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
    }
    server {
        listen 80;
        server_name cms.ai.madadfintech.com;
        location / {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
    }
    server {
        listen 80;
        server_name ops.ai.madadfintech.com;
        location / {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
    }

    # ------------------------------------------------------------------
    # Fallback for local/no-DNS access + IP-based requests.
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /cms/ {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location /visibility/ {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
        location = /health { return 200 "ok\n"; }
    }
}
