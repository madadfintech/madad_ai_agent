# MADAD Platform — Prometheus configuration (compose-mounted).
# Replaces the legacy top-level docker/prometheus.yml when the new alert
# rules + tighter scrape config land. Mounted at /etc/prometheus/prometheus.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: madad

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: madad-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - workflow:8001
          - communication:8002
          - cms:8003
          - nudge:8004
          - document:8005
          - visibility:8006
        labels:
          platform: madad

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
