# Madad log monitor — issue detection rules
#
# Each rule has:
#   name        — short slug, shown in /monitor/stats grouping
#   pattern     — Python regex; matched against each log line
#   severity    — error | warning | info (free-form; used for filtering only)
#   description — context for ops + future docs
#
# Edit this file + restart the log_monitor container (or POST /monitor/reload
# once we add it) to change what counts as an issue. Order matters: the FIRST
# rule that matches wins, so put the most specific patterns first.

rules:
  # -- High-signal: typed exceptions in our code paths --------------------

  - name: workflow_node_exception
    pattern: '\[TEMP-DBG\] node\.exception'
    severity: error
    description: A workflow node raised — the run will retry or fail.

  - name: mcp_call_terminal_failure
    pattern: '\[TEMP-DBG\] mcp\.call\.terminal_failure'
    severity: error
    description: An MCP tool call failed after all retries (timeout/auth/backend).

  - name: mcp_typed_error
    pattern: '\b(MCPError|MCPTimeoutError|MCPAuthError|MCPConflictError|MCPNotFoundError|MCPBackendError)\b'
    severity: error
    description: A typed MCP error surfaced.

  - name: traceback
    pattern: 'Traceback \(most recent call last\)'
    severity: error
    description: A Python traceback hit stderr — uncaught exception somewhere.

  # -- Domain-specific failures we care about ----------------------------

  - name: invoice_submit_failed
    pattern: 'invoice_submit_first\.failed|invoice_bulk\.submit_failed'
    severity: error
    description: An invoice submission failed at the backend round-trip.

  - name: invoice_extract_failed
    pattern: 'invoice_extract\.failed'
    severity: warning
    description: OCR extract failed (legacy path or single-flow fallback).

  - name: invoice_empty_draft
    pattern: 'invoice_extract\.empty_draft'
    severity: info
    description: OCR returned a sparse draft — confirm card renders anyway now.

  - name: payment_ref_fetch_failed
    pattern: 'payment_confirmed\.ref_fetch_failed'
    severity: warning
    description: Couldn't read application_ref from /me when rendering payment.confirmed.

  - name: payment_send_link_cta_failed
    pattern: 'payment_send_link\.cta_failed'
    severity: warning
    description: CTA-URL button send failed; fell back to plain-text payment link.

  - name: campaign_start_no_existing
    pattern: 'campaign_start\.deduped_no_existing_run'
    severity: warning
    description: Dedupe locked the start but no active run found — race window.

  - name: status_template_failed
    pattern: 'status_template\.failed'
    severity: warning
    description: A Meta-approved status template send failed; fell back to free text.

  - name: documents_processing_ack_failed
    pattern: 'documents_processing_ack\.failed'
    severity: info
    description: The "Got it — please wait" docs ack send failed.

  - name: dedupe_caught_duplicate
    pattern: 'status_poller\.orphan_run_skip|invoice_attempt\.deduped|docs\.inflight\.dedupe_skip|invoice\.inflight\.dedupe_skip|invoice\.submitted_sig\.dedupe_skip'
    severity: info
    description: A dedupe layer (status poller / inbound dedupe / inflight guard) caught a duplicate and silently dropped. SUCCESS signal — confirms guards are working.

  - name: forget_session
    pattern: 'forget_session\.cleared|forget_session\.failed'
    severity: info
    description: Admin /workflow/admin/forget-session executed.

  # -- HTTP / transport-level -------------------------------------------
  # Match both shapes our services emit:
  #   * structlog: ``... status=5xx`` or ``status_code=5xx``
  #   * uvicorn:   ``"POST /path HTTP/1.1" 5xx Server Error``

  - name: http_5xx
    pattern: '(\bstatus(_code)?=5[0-9]{2}\b)|("[A-Z]+ [^"]+ HTTP/[\d.]+" 5[0-9]{2})'
    severity: error
    description: A 5xx response surfaced (backend, MCP cluster, or our own service).

  - name: http_4xx_non_auth
    # Exclude common internet-scanner probe paths so real 4xx signals
    # don't drown in bot noise (UAT 2026-06-20: 60/71 captured events
    # were one scanner hitting /, /mcp, /jsonrpc, /robots.txt, etc.).
    pattern: '(\bstatus(_code)?=4(00|02|04|05|06|08|09|22|29)\b)|("[A-Z]+ [^"]+ HTTP/[\d.]+" 4(00|02|04|05|06|08|09|22|29))'
    # Two alternations cover structlog (``path=...``) and uvicorn
    # quoted (``"VERB /... HTTP"``). Scanner prefixes are matched
    # WITHOUT requiring a terminator — they're distinctive enough
    # that any path starting with them is a scanner probe (we don't
    # serve real routes under /admin, /wp-, /mcp, /SDK, etc.).
    exclude: 'path=/($|[? ])|path=/(robots|security|favicon|SDK|wp-|wordpress|admin|phpmyadmin|\.env|\.git|graphql|server-status|nice%20ports|mcp|jsonrpc|sse|api/v1)|("(GET|POST|HEAD|PUT|DELETE|OPTIONS) /(\?[^"]*)? HTTP)|("(GET|POST|HEAD|PUT|DELETE|OPTIONS) /(robots|security|favicon|SDK|wp-|wordpress|admin|phpmyadmin|\.env|\.git|graphql|server-status|nice%20ports|mcp|jsonrpc|sse|api/v1)[^"]* HTTP)'
    severity: warning
    description: A non-auth 4xx (400, 404, 409, etc.) from a legitimate path. Scanner probes (/, /mcp, /jsonrpc, /robots.txt, /security.txt, /favicon.ico, /sse) are excluded.

  - name: http_401_403
    pattern: '(\bstatus(_code)?=40[13]\b)|("[A-Z]+ [^"]+ HTTP/[\d.]+" 40[13])'
    severity: warning
    description: 401/403 — auth issues (token expiry, missing bearer).

  # -- Structured log levels --------------------------------------------

  - name: structlog_error
    pattern: '\blevel=error\b'
    severity: error
    description: Any structlog-level error event we haven't classified above.

  - name: critical_or_fatal
    pattern: '\b(CRITICAL|FATAL)\b'
    severity: error
    description: Python logging CRITICAL/FATAL — almost certainly bad.

  # NOTE: we intentionally do NOT alert on every level=warning — staging
  # logs tens of warnings/min. The rules above pick the high-signal
  # warnings; everything else stays in the raw container log.


# Behavioral rules — match deviations from EXPECTED behavior. The line-by-
# line regex rules above catch crashes; these catch the QA-bug class
# (duplicate sends, re-submission loops, slow operations, template
# variables rendering as em-dash). Each rule type is implemented in
# tools/log_monitor/behavioral.py.
#
# count rule:
#   trigger          — regex selecting the relevant log line; named or
#                      positional capture groups become the bucket key
#   threshold        — alert when count reaches this many in window
#   window_seconds   — sliding-window length
#   cooldown_seconds — don't re-alert the same bucket within this window
#
# value rule:
#   trigger        — regex selecting the line
#   value_pattern  — regex with ONE capture group, parsed as float
#   threshold      — alert when value >= threshold
behavioral_rules:

  # QA #1 (2026-06-19): 9 invoices generated 20+ messages. Catches any
  # template that fires 3+ times for the same identity within 5 minutes.
  # NOTE: cooldown 5 min so a sustained breach doesn't spam the issues log.
  - name: duplicate_outbound_send
    type: count
    severity: warning
    description: Same template fired 3+ times for one identity within 5 minutes — UX spam suspect
    trigger: '\[TEMP-DBG\] obs\.outbound\.send.*identity=(?P<identity>\S+).*template_key=(?P<template_key>\S+)'
    # UAT 2026-06-21: a few templates legitimately fire once per
    # SME action (KYC doc ack, invoice ack, LLM contextual reply) —
    # 3+ within 5 minutes is normal behaviour, not duplication.
    # Templates whose duplication WOULD be a real bug
    # (bulk.processing, batch.preview, documents.checklist, offers.preview, …)
    # are NOT in this list so they still fire.
    exclude: 'template_key=onboarding\.documents\.single_received|template_key=onboarding\.invoice\.received|template_key=onboarding\.invoice\.submitting|template_key=onboarding\.help\.contextual'
    threshold: 3
    window_seconds: 300
    cooldown_seconds: 300

  # QA #2 (2026-06-19): 47 invoice tool calls for ~9 files = re-submission loop.
  # UAT 2026-06-21 retune: a 3-invoice batch fires obs.invoice.submit
  # three times (one per row, all with the same attempt_sig) — that's
  # legitimate. Group by (identity, filename) instead of identity alone
  # so distinct files in one batch DON'T collide; the rule then fires
  # only when the SAME file gets submitted 3+ times in 30 min, which is
  # the actual re-submission-loop shape.
  - name: invoice_resubmit_loop
    type: count
    severity: error
    description: Same invoice file submitted 3+ times for one identity within 30 min — re-submission loop suspect
    trigger: '\[TEMP-DBG\] obs\.invoice\.submit.*filename=(?P<filename>\S+).*identity=(?P<identity>\S+)'
    threshold: 3
    window_seconds: 1800
    cooldown_seconds: 600

  # QA 2026-06-19 (CR double-upload): CR was uploaded twice — once via
  # forced upload_commercial_registration, once via the classifier's
  # internal upload. Same (identity, filename) hitting KYC upload 2+
  # times within 60s is almost always a duplicate-upload bug.
  - name: duplicate_kyc_upload
    type: count
    severity: error
    description: Same (identity, filename) uploaded to KYC 2+ times within 60s — duplicate-upload suspect
    trigger: '\[TEMP-DBG\] obs\.kyc\.upload.*identity=(?P<identity>\S+).*filename=(?P<filename>\S+)'
    threshold: 2
    window_seconds: 60
    cooldown_seconds: 60

  # QA #5 (2026-06-19): 8 invoices took >10 minutes sequentially. Catches
  # any single invoice extract or submit MCP call > 30s — that's the
  # window where the SME notices the slowness. Values are recorded by
  # mcp.call.success which the MCP client already emits.
  - name: slow_invoice_extract
    type: value
    severity: warning
    description: Invoice extract took longer than 30s — investigate OCR / network
    trigger: '\[TEMP-DBG\] mcp\.call\.success.*tool=madad_invoices_extract'
    value_pattern: 'elapsed_ms=(\d+)'
    threshold: 30000

  - name: slow_invoice_submit
    type: value
    severity: warning
    description: Invoice submit took longer than 30s — investigate backend create
    trigger: '\[TEMP-DBG\] mcp\.call\.success.*tool=madad_invoices_(?:submit_invoice|extract_and_submit_invoice)'
    value_pattern: 'elapsed_ms=(\d+)'
    threshold: 30000

  # QA #7 (2026-06-19): disbursed message rendered with "🏦 Lender: —"
  # and "Available limit: QAR —". The agent passed only 4 vars when the
  # Meta template expected 6 → 2 placeholders rendered as em-dash.
  # adapters.py counts em-dash vars per send; this rule fires when a
  # template goes out with 2+ blanks.
  - name: empty_template_variables
    type: count
    severity: warning
    description: Template fired with 2+ key variables rendering as em-dash — wiring bug suspect
    trigger: '\[TEMP-DBG\] obs\.outbound\.send.*template_key=(?P<template_key>\S+).*vars_em_dash_count=(?P<em_dash_count>[2-9])'
    threshold: 1
    window_seconds: 60
    cooldown_seconds: 120

  # Bonus — catches any MCP terminal failure regardless of tool. The
  # line-by-line ``mcp_call_terminal_failure`` rule already fires on
  # this, so the behavioral one is redundant for the regex layer; it's
  # here to demonstrate cross-cutting "any tool failing too often"
  # detection. Tune up the threshold once we have a baseline of normal
  # failure noise.
  - name: mcp_call_failures_burst
    type: count
    severity: error
    description: 5+ MCP terminal failures across any tool within 5 minutes — backend hiccup or auth wedge
    trigger: '\[TEMP-DBG\] mcp\.call\.terminal_failure'
    threshold: 5
    window_seconds: 300
    cooldown_seconds: 300
