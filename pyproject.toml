[project]
name = "madad_fintech_ai"
version = "0.1.0"
description = "AI backend for Madad Fintech"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS template strings (server-rendered visibility v1 stubs) carry
# long CSS rules and ``href`` lines where wrapping hurts readability of
# the rendered output. E501 is otherwise enforced project-wide.
"app/services/visibility/main.py" = ["E501"]
# Pre-existing long lines in test bodies — agent flow narratives that
# read better on one line than wrapped. Carved out per-file so new
# tests still get E501 enforcement.
"tests/onboarding/test_payment_waive_off.py" = ["E501"]
"tests/onboarding/test_phase1b_invoice_collect.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Per-module carve-outs for legacy modules that pre-date strict-mode adoption.
# Each entry is paying down tech debt that the team has carried for months —
# the new code added in 2026-06 (visibility v1 stubs, button helper, CMS
# subject path, export/import script) is fully strict-clean. Goal is to
# move these back to strict one PR at a time; do not expand the list.

[[tool.mypy.overrides]]
module = "app.workers.*"
# Celery's @shared_task decorator confuses mypy --strict — it sees the
# wrapped function as Untyped. Real fix is upstream Celery type stubs.
disable_error_code = ["misc", "unused-ignore"]

[[tool.mypy.overrides]]
module = "app.services.workflow.onboarding"
# Long-standing Any/None narrowing in the OCR + offers + CSV codepaths
# where the upstream MCP envelope is loosely typed. Tracked as a sweep.
disable_error_code = ["arg-type", "no-redef", "no-any-return", "assignment"]

[[tool.mypy.overrides]]
module = "app.services.workflow.main"
# RunStatus splat ``*statuses`` where the store accepts a single enum.
# Real fix needs a signature change on WorkflowRunStore.
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
