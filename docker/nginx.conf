# Edge reverse proxy mapping the public domains onto the service containers.
#   ai-api.madadfintech.com  -> conversational/workflow + communication + cms +
#                                document + visibility (path-routed)
# Legacy host names (api.ai.*, cms.ai.*, ops.ai.*) are kept as HTTP-only
# server blocks for backward compatibility.
#
# TLS: NOT terminated here. The Google Cloud LB in front of the VM
# terminates TLS with a Google-managed cert for ``ai-api.madadfintech.com``
# and forwards to us over plain HTTP on port 80. Do NOT re-add ssl_
# directives on this server — the LB's health-check probes HTTP:80
# /health and adding TLS here breaks it.
#
# DNS: uses docker's embedded resolver (127.0.0.11) with a 10-second cache
# so nginx picks up new container IPs after a restart WITHOUT a manual
# reload. The classic ``upstream foo { server foo:8001; }`` block resolves
# only at nginx start and caches the IP forever — after any co-deployed
# container restart, that upstream address goes stale and every request
# returns 502. Using ``set $var host:port; proxy_pass http://$var;`` forces
# nginx to hit the resolver for each new address, so restart cycles are safe.

worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve the inbound correlation id (the apps generate one if absent).
    proxy_set_header X-Request-ID      $request_id;

    # Shared client size — CSVs, invoice ZIPs etc.
    client_max_body_size 25M;

    # ------------------------------------------------------------------
    # ai-api.madadfintech.com — the LB terminates TLS and forwards HTTP.
    # All admin + API paths mounted on the same host, path-routed.
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name ai-api.madadfintech.com;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /cms/ {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location /visibility/ {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
        location = /health { return 200 "ok\n"; }
    }

    # ------------------------------------------------------------------
    # Legacy host names — kept for backward compatibility.
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name api.ai.madadfintech.com;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location = /health {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
    }
    server {
        listen 80;
        server_name cms.ai.madadfintech.com;
        location / {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
    }
    server {
        listen 80;
        server_name ops.ai.madadfintech.com;
        location / {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
    }

    # ------------------------------------------------------------------
    # Default fallback for IP-based access (34.18.178.186 without Host).
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /cms/ {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location /visibility/ {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
        location = /health { return 200 "ok\n"; }
    }
}
