# Edge reverse proxy mapping the public domains onto the service containers.
#   api.ai.madadfintech.com  -> conversational/workflow + communication + document
#   cms.ai.madadfintech.com  -> CMS admin
#   ops.ai.madadfintech.com  -> Operational Visibility admin
# Path prefixes are preserved so the upstream route tables match unchanged.
#
# DNS: uses docker's embedded resolver (127.0.0.11) with a 10-second cache so
# nginx picks up new container IPs after a restart WITHOUT a manual reload.
# The classic ``upstream foo { server foo:8001; }`` block resolves only at
# nginx start and caches the IP forever — after any co-deployed container
# restart, that upstream address goes stale and every request returns
# 502. Using ``set $var host:port; proxy_pass http://$var;`` forces nginx
# to hit the resolver for each new address, so restart cycles are safe.

worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve the inbound correlation id (the apps generate one if absent).
    proxy_set_header X-Request-ID      $request_id;

    # Public conversational API.
    server {
        listen 80;
        server_name api.ai.madadfintech.com;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location = /health {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
    }

    # CMS admin panel/API.
    server {
        listen 80;
        server_name cms.ai.madadfintech.com;
        location / {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
    }

    # Operational Visibility admin panel/API.
    server {
        listen 80;
        server_name ops.ai.madadfintech.com;
        location / {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
    }

    # Fallback for local/no-DNS access: path-routed on the default host.
    server {
        listen 80 default_server;
        server_name _;

        location /workflow/ {
            set $upstream_workflow      workflow:8001;
            proxy_pass http://$upstream_workflow;
        }
        location /comm/ {
            set $upstream_communication communication:8002;
            proxy_pass http://$upstream_communication;
        }
        location /cms/ {
            set $upstream_cms           cms:8003;
            proxy_pass http://$upstream_cms;
        }
        location /documents/ {
            set $upstream_document      document:8005;
            proxy_pass http://$upstream_document;
        }
        location /visibility/ {
            set $upstream_visibility    visibility:8006;
            proxy_pass http://$upstream_visibility;
        }
        location = /health { return 200 "ok\n"; }
    }
}
