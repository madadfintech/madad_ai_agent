# Edge reverse proxy mapping the public domains onto the service containers.
#   api.ai.madadfintech.com  -> conversational/workflow + communication + document
#   cms.ai.madadfintech.com  -> CMS admin
#   ops.ai.madadfintech.com  -> Operational Visibility admin
# Path prefixes are preserved so the upstream route tables match unchanged.

worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    upstream workflow      { server workflow:8001; }
    upstream communication { server communication:8002; }
    upstream cms           { server cms:8003; }
    upstream document      { server document:8005; }
    upstream visibility    { server visibility:8006; }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve the inbound correlation id (the apps generate one if absent).
    proxy_set_header X-Request-ID      $request_id;

    # Public conversational API.
    server {
        listen 80;
        server_name api.ai.madadfintech.com;

        location /workflow/ { proxy_pass http://workflow; }
        location /comm/     { proxy_pass http://communication; }
        location /documents/ { proxy_pass http://document; }
        location = /health  { proxy_pass http://workflow; }
    }

    # CMS admin panel/API.
    server {
        listen 80;
        server_name cms.ai.madadfintech.com;
        location / { proxy_pass http://cms; }
    }

    # Operational Visibility admin panel/API.
    server {
        listen 80;
        server_name ops.ai.madadfintech.com;
        location / { proxy_pass http://visibility; }
    }

    # Fallback for local/no-DNS access: path-routed on the default host.
    server {
        listen 80 default_server;
        server_name _;

        location /workflow/   { proxy_pass http://workflow; }
        location /comm/       { proxy_pass http://communication; }
        location /cms/        { proxy_pass http://cms; }
        location /documents/  { proxy_pass http://document; }
        location /visibility/ { proxy_pass http://visibility; }
        location = /health    { return 200 "ok\n"; }
    }
}
