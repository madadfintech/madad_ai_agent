[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Drain docker container stdout (the docker host mounts
# /var/lib/docker/containers; each container's logs sit under
# /var/lib/docker/containers/<id>/<id>-json.log). The MADAD services
# already emit structlog JSON to stdout, so we just need to lift it.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/log/flb-docker.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Tag               docker.*

# Enrich every record with the container/service name (parsed from the
# Docker-injected attrs). The container name is the source of truth for
# routing into per-service OpenSearch indices.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

# Promote `service` (already on our structlog records) so OpenSearch
# can route by index per service. When the record has no service field
# (e.g. nginx/postgres/redis container logs that aren't structlog),
# fall back to the container name. The modify filter's
# ``Key_does_not_exist`` predicate fires the rename only when the
# record lacks the key — the previous Key_value_does_not_match form
# isn't a valid modify-filter predicate, so the rename never fired and
# every record was indexed by the raw container name.
[FILTER]
    Name    modify
    Match   docker.*
    Condition Key_does_not_exist service
    Rename  container_name service

# Ship to OpenSearch.
[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch
    Port              9200
    HTTP_User         ${OPENSEARCH_USER}
    HTTP_Passwd       ${OPENSEARCH_PASSWORD}
    Suppress_Type_Name On
    Logstash_Format   On
    Logstash_Prefix   madad-logs
    Time_Key          @timestamp
    tls               Off
    Replace_Dots      On
    Trace_Error       On
