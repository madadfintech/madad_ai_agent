# Full local/staging stack for the MADAD agentic platform.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# One image (docker/Dockerfile) runs every service/worker via a different
# command. Secrets default to dev values and can be overridden from the shell or
# a .env file (e.g. POSTGRES_PASSWORD=…, JWT_SECRET=…). Backends are wired to the
# Postgres + Redis containers; auth seams stay dev-open unless their secrets set.

x-build: &build
  build:
    context: ..
    dockerfile: docker/Dockerfile

# Shared runtime config for every app/worker container.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  PERSISTENCE__BACKEND: postgres
  PERSISTENCE__CMS_CACHE: redis
  POSTGRES__DSN: postgresql+asyncpg://madad:${POSTGRES_PASSWORD:-change_me}@postgres:5432/madad
  REDIS__URL: redis://redis:6379/0
  WORKFLOW__CHECKPOINT_BACKEND: postgres
  WORKFLOW__SESSION_BACKEND: redis
  WORKFLOW__EVENT_BACKEND: redis
  EVENTS__TRANSPORT: redis
  CELERY__BROKER_URL: redis://redis:6379/1
  CELERY__RESULT_BACKEND: redis://redis:6379/2
  # Auth seams — empty = dev-open; set to enforce.
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
  SECURITY__JWT_SECRET: ${JWT_SECRET:-}
  SECURITY__WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  OBSERVABILITY__SENTRY_DSN: ${SENTRY_DSN:-}

x-app: &app
  <<: *build
  env_file:
    - path: ../.env
      required: false
  environment: *app-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # -- infrastructure --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: madad_postgres
    environment:
      POSTGRES_DB: madad
      POSTGRES_USER: madad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madad -d madad"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: madad_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -- schema migration (one-shot, runs before the apps) ---------------------
  migrate:
    <<: *build
    container_name: madad_migrate
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # -- application services (one image, per-service command) -----------------
  workflow:
    <<: *app
    container_name: madad_workflow
    command: ["uvicorn", "app.services.workflow.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  communication:
    <<: *app
    container_name: madad_communication
    command: ["uvicorn", "app.services.communication.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  cms:
    <<: *app
    container_name: madad_cms
    command: ["uvicorn", "app.services.cms.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nudge:
    <<: *app
    container_name: madad_nudge
    command: ["uvicorn", "app.services.nudge.main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  document:
    <<: *app
    container_name: madad_document
    command: ["uvicorn", "app.services.document.main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  visibility:
    <<: *app
    container_name: madad_visibility
    command: ["uvicorn", "app.services.visibility.main:app", "--host", "0.0.0.0", "--port", "8006"]
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -- async workers ---------------------------------------------------------
  celery-worker:
    <<: *app
    container_name: madad_celery_worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "madad", "--loglevel=info"]
    ports: []

  celery-beat:
    <<: *app
    container_name: madad_celery_beat
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    ports: []

  # Cross-process drain of the unified event stream into the visibility store.
  visibility-consumer:
    <<: *app
    container_name: madad_visibility_consumer
    command: ["python", "-m", "app.services.visibility.consumer"]
    ports: []

  # -- log monitor (UAT diagnostic sidecar) ---------------------------------
  # Tails docker logs for every madad_* container, filters lines through
  # tools/log_monitor/rules.yml, and writes matches to ${HOME}/madad-monitor/
  # issues.log on the host. Exposes a small admin API on 127.0.0.1:8090 for
  # tail/clear/stats. See tools/log_monitor/README.md for usage.
  log_monitor:
    build:
      context: ../tools/log_monitor
      dockerfile: Dockerfile
    image: madad/log-monitor:0.1.0
    container_name: madad_log_monitor
    restart: unless-stopped
    environment:
      WATCH_CONTAINERS: "${LOG_MONITOR_CONTAINERS:-madad_workflow,madad_celery_worker,madad_cms,madad_communication,madad_document,madad_nudge,madad_visibility}"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      NOTIFY_WEBHOOK_URL: ${LOG_MONITOR_NOTIFY_WEBHOOK:-}
      ISSUES_LOG_PATH: /data/issues.log
      RULES_PATH: /app/rules.yml
    volumes:
      # docker.sock — read-only is sufficient since we only ``docker logs``.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host mount so ops can ``tail -f`` the issues log from SSH directly.
      - ${LOG_MONITOR_HOST_DIR:-/home/jathish/madad-monitor}:/data
    ports:
      # Bind to loopback only — admin-token gated, never expose publicly.
      - "127.0.0.1:8090:8090"
    depends_on:
      - workflow

  # -- edge + observability --------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: madad_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # TLS is terminated by the Google Cloud LB in front of the VM (cert
    # for ai-api.madadfintech.com, Google-managed). This container serves
    # HTTP only on 80.
    ports:
      - "80:80"
    depends_on:
      - workflow
      - communication
      - cms
      - visibility
      - document
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: madad_prometheus
    volumes:
      # New layout — bundled config + alert rules. The legacy
      # ./prometheus.yml is now superseded; remove it once O2 ships.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: madad_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provision datasource + dashboards from files so every fresh
      # boot gets the same pinned views instead of relying on UI clicks.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # Centralized JSON log aggregation — fluent-bit reads every container's
  # stdout (the docker JSON-log files) and ships into OpenSearch. The
  # structlog access log emitted by every MADAD service is already JSON
  # so no extra parser work is needed.
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: madad_opensearch
    environment:
      - cluster.name=madad-logs
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: madad_opensearch_dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2.0
    container_name: madad_fluent_bit
    environment:
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      # Read every container's JSON log file off the host's docker dir.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_db:/var/log
    depends_on:
      - opensearch
    restart: unless-stopped

  # Distributed tracing — every service ships OTLP traces to the
  # collector; the collector batches + filters probe noise + forwards
  # to Jaeger for storage and the UI. Set OBSERVABILITY__OTEL_ENDPOINT
  # to http://otel-collector:4318/v1/traces on each service to enable.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: madad_otel_collector
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: madad_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC collector
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  opensearch_data:
  fluent_bit_db:
